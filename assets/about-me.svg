  <text x="64" y="118" fill="#3fb950" font-family="JetBrains Mono, Consolas, monospace" font-size="14">01 — ABOUT ME</text>
  <text x="64" y="165" fill="#e6ebf5" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="34" font-weight="700">Learning the cloud. Securing what runs on it.</text>

  <text x="64" y="210" fill="#c9d1e8" font-family="Inter, Segoe UI, sans-serif" font-size="19">
    <tspan x="64" dy="0">I am a cloud computing student and cybersecurity enthusiast focused on building secure, practical systems.</tspan>
    <tspan x="64" dy="31">My work brings together AWS infrastructure, IAM security, and AI-powered tooling—from mapping privilege</tspan>
    <tspan x="64" dy="31">escalation paths to deploying multi-tier environments and creating useful assistants for everyday problems.</tspan>
  </text>

