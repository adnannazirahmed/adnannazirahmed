name: Refresh profile statistics

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/update_stats.py"
      - "requirements.txt"
      - "tests/test_update_stats.py"
      - ".github/workflows/refresh-profile.yml"
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-statistics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test contribution parsing and MOTD rendering
        run: python -m unittest discover -s tests -v

      - name: Refresh profile data and cloud-security MOTD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_GITHUB_USER: adnannazirahmed
        run: python scripts/update_stats.py

      - name: Commit changes when statistics differ
        shell: bash
        run: |
          if git diff --quiet -- README.md assets/; then
            echo "Profile data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md assets/
          git commit -m "chore: refresh profile data"
          git push

